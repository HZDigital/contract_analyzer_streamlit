name: Trigger auto deployment for contractanalyzer

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/contractanalyzer-AutoDeployTrigger-ea1d8693-e52e-4b37-9561-908e8a061ef9.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.CONTRACTANALYZER_AZURE_CREDENTIALS }}

      - name: Apply analyzer Blob lifecycle policy
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
        run: |
          test -n "$AZURE_STORAGE_ACCOUNT_NAME"
          CURRENT_POLICY="$RUNNER_TEMP/current-storage-lifecycle-policy.json"
          MERGED_POLICY="$RUNNER_TEMP/merged-storage-lifecycle-policy.json"
          APPLIED_POLICY="$RUNNER_TEMP/applied-storage-lifecycle-policy.json"
          if ! az storage account management-policy show \
            --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
            --resource-group AIWebinarRAG01_RG \
            --query policy \
            --output json > "$CURRENT_POLICY"; then
            printf '{"rules": []}\n' > "$CURRENT_POLICY"
          fi
          python scripts/merge_storage_lifecycle_policy.py \
            --existing "$CURRENT_POLICY" \
            --required infra/storage-lifecycle-policy.json \
            --output "$MERGED_POLICY"
          az storage account management-policy create \
            --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
            --resource-group AIWebinarRAG01_RG \
            --policy "@$MERGED_POLICY"
          az storage account management-policy show \
            --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
            --resource-group AIWebinarRAG01_RG \
            --query policy \
            --output json > "$APPLIED_POLICY"
          python scripts/merge_storage_lifecycle_policy.py \
            --existing "$APPLIED_POLICY" \
            --required infra/storage-lifecycle-policy.json \
            --verify

      - name: Build and deploy container image
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: hzgenaicontainerregistry.azurecr.io
          registryUsername: ${{ secrets.CONTRACTANALYZER_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CONTRACTANALYZER_REGISTRY_PASSWORD }}
          containerAppName: contractanalyzer
          resourceGroup: AIWebinarRAG01_RG
          imageToBuild: hzgenaicontainerregistry.azurecr.io/contractanalyzer:${{ github.sha }}
          targetPort: 8080
          ingress: external
          buildArguments: >-
            VITE_MSAL_CLIENT_ID=${{ vars.VITE_MSAL_CLIENT_ID }}
            VITE_MSAL_AUTHORITY=${{ vars.VITE_MSAL_AUTHORITY }}
            VITE_MSAL_REDIRECT_URI=${{ vars.VITE_MSAL_REDIRECT_URI }}
            VITE_DEPLOYMENT_CONFIGURATION=${{ vars.VITE_DEPLOYMENT_CONFIGURATION }}
            VITE_DEPLOYMENT_CSS=${{ vars.VITE_DEPLOYMENT_CSS }}


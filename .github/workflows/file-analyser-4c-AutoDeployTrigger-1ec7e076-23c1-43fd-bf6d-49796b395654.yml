name: 4C File Analyser

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/file-analyser-4c-AutoDeployTrigger-1ec7e076-23c1-43fd-bf6d-49796b395654.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FILEANALYSER4C_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FILEANALYSER4C_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FILEANALYSER4C_AZURE_SUBSCRIPTION_ID }}

      - name: Apply analyzer Blob lifecycle policy
        env:
          AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME_4C }}
        run: |
          test -n "$AZURE_STORAGE_ACCOUNT_NAME"
          CURRENT_POLICY="$RUNNER_TEMP/current-storage-lifecycle-policy.json"
          MERGED_POLICY="$RUNNER_TEMP/merged-storage-lifecycle-policy.json"
          APPLIED_POLICY="$RUNNER_TEMP/applied-storage-lifecycle-policy.json"
          if ! az storage account management-policy show \
            --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
            --resource-group rg-mindscape \
            --query policy \
            --output json > "$CURRENT_POLICY"; then
            printf '{"rules": []}\n' > "$CURRENT_POLICY"
          fi
          python scripts/merge_storage_lifecycle_policy.py \
            --existing "$CURRENT_POLICY" \
            --required infra/storage-lifecycle-policy.json \
            --output "$MERGED_POLICY"
          az storage account management-policy create \
            --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
            --resource-group rg-mindscape \
            --policy "@$MERGED_POLICY"
          az storage account management-policy show \
            --account-name "$AZURE_STORAGE_ACCOUNT_NAME" \
            --resource-group rg-mindscape \
            --query policy \
            --output json > "$APPLIED_POLICY"
          python scripts/merge_storage_lifecycle_policy.py \
            --existing "$APPLIED_POLICY" \
            --required infra/storage-lifecycle-policy.json \
            --verify

      - name: Build and deploy container image
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile
          registryUrl: 4cgroupagcontainerregistry.azurecr.io
          registryUsername: ${{ secrets.FILEANALYSER4C_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.FILEANALYSER4C_REGISTRY_PASSWORD }}
          containerAppName: file-analyser-4c
          resourceGroup: rg-mindscape
          imageToBuild: 4cgroupagcontainerregistry.azurecr.io/file-analyser-4c:${{ github.sha }}
          targetPort: 8080
          ingress: external
          buildArguments: >-
            VITE_MSAL_CLIENT_ID=${{ vars.VITE_MSAL_CLIENT_ID_4C }}
            VITE_MSAL_AUTHORITY=${{ vars.VITE_MSAL_AUTHORITY }}
            VITE_DEPLOYMENT_CONFIGURATION=${{ vars.VITE_DEPLOYMENT_CONFIGURATION_4C }}

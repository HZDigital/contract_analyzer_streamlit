services:
  contract-analyzer:
    build:
      context: .
      args:
        # Export the values in frontend/.env before invoking Compose.
        VITE_MSAL_CLIENT_ID: ${VITE_MSAL_CLIENT_ID}
        VITE_MSAL_AUTHORITY: ${VITE_MSAL_AUTHORITY}
        VITE_MSAL_REDIRECT_URI: ${VITE_MSAL_REDIRECT_URI:-http://localhost:8080}
        VITE_DEPLOYMENT_CONFIGURATION: ${VITE_DEPLOYMENT_CONFIGURATION:-}
        VITE_DEPLOYMENT_CSS: ${VITE_DEPLOYMENT_CSS:-}
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      AZURE_STORAGE_CONTAINER_NAME: ${AZURE_STORAGE_CONTAINER_NAME}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING}
      ENTRA_API_AUDIENCE: ${ENTRA_API_AUDIENCE}
      ENTRA_ALLOWED_TENANT_IDS: ${ENTRA_ALLOWED_TENANT_IDS:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-12-01-preview}
      AZURE_MISTRAL_DOCUMENT_AI_ENDPOINT: ${AZURE_MISTRAL_DOCUMENT_AI_ENDPOINT:-}
      AZURE_MISTRAL_DOCUMENT_AI_API_KEY: ${AZURE_MISTRAL_DOCUMENT_AI_API_KEY:-}
      AZURE_MISTRAL_DOCUMENT_AI_MODEL: ${AZURE_MISTRAL_DOCUMENT_AI_MODEL:-mistral-document-ai-2512}
      AZURE_MISTRAL_DOCUMENT_AI_TIMEOUT_SECONDS: ${AZURE_MISTRAL_DOCUMENT_AI_TIMEOUT_SECONDS:-90}
      SEARXNG_URL: ${SEARXNG_URL}

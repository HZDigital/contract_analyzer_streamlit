services:
  contract-analyzer:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./results:/app/results
    environment:
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
      - APP_ENVIRONMENT=${APP_ENVIRONMENT:-full}
